# Repository gate.
#
# The checks here are the ones that must hold on every change, and they are
# deliberately the CHEAP, OFFLINE ones. P0 ground truth (the workflow that
# probes real trackers) is separate and runs only when experiments change,
# because pointing a probe at somebody else's server on every push is load
# this project has no justification for (RULES 4).
#
# The distinction that matters: a gate failing here means THIS REPOSITORY is
# inconsistent with itself. A P0 experiment "failing" means the internet
# answered differently, which is a measurement, not a broken build.
#
# WHY THIS FILE DOES NOT LIST THE CHECKS
#   It used to, one step per check, and that made two lists of the same thing:
#   this file and `scripts/check-gate.py`. A value in two places with no check
#   between them drifts, and the copy a reader trusts is the wrong one. The
#   runner is the list now, it names every check it ran and every one it
#   skipped, and `--strict` makes a skip a failure here because the runner
#   image is built on purpose and a skip means the build broke.
#
# WHY THERE IS A WINDOWS LEG
#   RULES 15.5 says a contributor on Windows must be able to run everything a
#   contributor on Linux can, and that was an assertion until something ran it.
#   The gate is Python precisely so it can be. ⚠ `python3` on a Windows host is
#   routinely a stub that exits without running, so that leg calls `python`.
name: gate

on:
  push:
    branches:
      - main
      - 'ephemeral-**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: python3
            full: true
          - os: windows-2025
            py: python
            full: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      # Pinned to a commit SHA, not a tag: tags are mutable (C-45), and the
      # anti-pattern exhibit's tracker shows what tag-pinning costs -- all 24
      # of its tracker items were dependency-bump PRs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conditions
        run: |
          echo "runner image : ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "interpreter  : $(${{ matrix.py }} --version 2>&1)"
          echo "commit       : ${GITHUB_SHA}"

      # ⛔ The exit code is read from this process, unpiped. A guard on the
      # left of a pipe reports the pipeline's status.
      - name: The gate
        run: ${{ matrix.py }} scripts/check-gate.py --strict

      # Two demonstrations that belong to CI rather than to the local gate:
      # each needs a second run to compare against, and neither is something a
      # contributor should have to remember to do by hand.
      #
      # Determinism is asserted against the real corpus rather than a toy
      # input. RULES 3.6.
      - name: End-to-end offline, byte-identical across two runs
        if: matrix.full
        run: |
          ${{ matrix.py }} scripts/generate.py --offline --out "$RUNNER_TEMP/gen1"
          ${{ matrix.py }} scripts/generate.py --offline --out "$RUNNER_TEMP/gen2"
          if diff -r "$RUNNER_TEMP/gen1" "$RUNNER_TEMP/gen2"; then
            echo "byte-identical across two runs"
            sha256sum "$RUNNER_TEMP/gen1/trackers_all.txt"
          else
            echo "::error::two runs over identical inputs differed (RULES 3.6)"
            exit 1
          fi

      # A failed generation must leave prior public data intact, demonstrated
      # by an actual failed run rather than asserted (RULES 3.5).
      - name: Atomic publication, a failed run does not touch prior output
        if: matrix.full
        run: |
          ${{ matrix.py }} scripts/generate.py --offline --out "$RUNNER_TEMP/atomic"
          before=$(sha256sum "$RUNNER_TEMP/atomic/trackers_all.txt" | cut -d' ' -f1)
          # An empty fixture directory makes every source FAIL, which the
          # verifier must refuse to publish.
          mkdir -p "$RUNNER_TEMP/empty-fixtures"
          set +e
          ${{ matrix.py }} scripts/generate.py --offline \
            --fixtures "$RUNNER_TEMP/empty-fixtures" --out "$RUNNER_TEMP/atomic"
          rc=$?
          set -e
          after=$(sha256sum "$RUNNER_TEMP/atomic/trackers_all.txt" | cut -d' ' -f1)
          echo "failed-run exit=$rc  before=$before  after=$after"
          if [ "$rc" != "1" ]; then
            echo "::error::a total source failure must exit 1, got $rc"; exit 1
          fi
          if [ "$before" != "$after" ]; then
            echo "::error::a failed generation modified published data (RULES 3.5)"
            exit 1
          fi
          echo "prior output intact after a failed generation"

      # ⛔ A gate that leaves the tree dirty is a gate RULES 10.3 step 6 can
      # never be satisfied against, and the way that happens is a check
      # writing its output into the tree instead of into scratch. Checked
      # here rather than trusted, on a fresh checkout.
      - name: The gate left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::running the gate modified the working tree"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean after the gate"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Gate on ${{ matrix.os }}"
            echo
            echo "Offline. No tracker was contacted by this workflow."
            echo
            echo "\`scripts/check-gate.py --strict\` names every check it ran."
            echo "The two CI-only demonstrations are end-to-end determinism"
            echo "and atomic publication, and they run on the Linux leg."
          } >> "$GITHUB_STEP_SUMMARY"
