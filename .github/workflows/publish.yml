# Publish the dataset to the `data` branch. T-063, decision D5.
#
# ⛔ THE LABELS ARE THE PRODUCT AND THE PLAINTEXT IS NOT. The value gate
# answered that this project is justified as a labelled dataset and NOT as a
# list: unfiltered, the plaintext is 13.4x longer than the baseline and five
# times less likely to answer. So every run publishes `trackers_all.json` and
# `trackers_all.csv` beside the text file, and a consumer who takes only the
# text has taken the worse half. `docs/schema.md` defines every field.
#
# ⛔ ATOMIC, AND THE FAILURE DIRECTION IS THE POINT (RULES 3.5). Generation
# stages, verifies and only then moves output into place; if verification
# fails, nothing is committed and whatever is on `data` stays there. A failed
# run leaves the previous dataset intact rather than replacing it with the
# consequences of an outage.
#
# ⭐ WHY THE STATE LIVES ON THE DATA BRANCH. History is what makes a label
# worth reading, and workflow artefacts expire after 90 days while a branch
# does not. `sources.jsonl` (T-103) rides along on the same reasoning: it is
# what makes "why did this tracker disappear" answerable after the run that
# lost it is over, and an artefact that expires cannot answer it.
# `state.jsonl` is fetched from `data`, the sweep's records are
# folded into it, and it is pushed back with the dataset it produced. That also
# gives the run something the sweep has never had: state shared across runs.
#
# ⚠ `C-55`: a scheduled workflow runs only on the default branch, so `data` can
# never carry a cron of its own. This lives on `main` and writes there.
name: Publish

on:
  # ⭐ After a sweep, so the dataset carries the health it just measured. A
  # `workflow_run` fires on the default branch's workflow file regardless of
  # what the sweep did, so the generation below is what decides whether
  # anything is worth publishing -- not this trigger.
  workflow_run:
    workflows: ["Health sweep"]
    types: [completed]
  workflow_dispatch:
    inputs:
      offline:
        description: "build from committed fixtures instead of fetching upstreams"
        required: false
        default: false
        type: boolean

# Least privilege, and this is the one workflow that needs more than read:
# it pushes the dataset. `actions: read` is for downloading the triggering
# sweep's records and nothing else. It touches no releases and no issues.
permissions:
  contents: write
  actions: read

# ⛔ Never two publishers at once. `cancel-in-progress: false` on purpose:
# cancelling a run mid-push is how a branch ends up with half a dataset, and a
# queued publish costs nothing but a few minutes.
concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Pinned to a commit SHA, not a tag: tags are mutable (C-45).
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Fix the instant this run is stamped with
        run: echo "PUBLISH_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The data branch may not exist yet. A first run creates it as an ORPHAN:
      # it carries data and none of this repository's code history, so a
      # consumer cloning it gets the dataset and nothing else.
      - name: Fetch the data branch, or start one
        run: |
          # ⛔ The identity is derived, never written into the tree.
          # `check-no-secrets.py --public` refused a hardcoded address here and
          # it was right to: an email literal in a tracked file is personal
          # data whether or not it is a credential. The noreply form attributes
          # the commit to the operator, which is what
          # docs/conventions/git.md requires, and publishes no address.
          git config user.name "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data --depth 1
            git worktree add published data
            echo "existing data branch checked out"
          else
            git worktree add --detach published
            cd published
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            echo "started a new orphan data branch"
          fi

      # ⛔ THE RECORDS THE SWEEP JUST TOOK, not only the committed ones.
      # Without this the publisher folds the same two committed records on
      # every run and **every scheduled sweep reaches nobody**: the labels
      # would be frozen at the day they were committed while a workflow ran
      # every three hours looking busy. Its artefact is the only copy, and it
      # expires in 90 days, which is why it is folded into branch state here.
      #
      # `continue-on-error`: a dispatch has no triggering run and a failed
      # sweep may have uploaded nothing. Neither is a reason to refuse to
      # publish what is already known.
      - name: Take the triggering sweep's records
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-sweep-${{ github.event.workflow_run.id }}
          path: sweep-fresh
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Fold whatever health exists into the history the branch already
      # carries. ⚠ Absent on a first run, which is not an error: a dataset with
      # no measurements is honestly labelled `unknown`.
      - name: Fold the health into the history
        id: records
        run: |
          mkdir -p sweep-in
          if [ -f published/state.jsonl ]; then
            cp published/state.jsonl sweep-in/state.jsonl
            echo "carried the existing history forward"
          fi
          # T-103. The per-source provenance, on the same terms as the state:
          # the branch is the durable copy and an artefact is not (C-44).
          if [ -f published/sources.jsonl ]; then
            cp published/sources.jsonl sweep-in/sources.jsonl
            echo "carried the source provenance forward"
          fi
          # Committed records are what this repository keeps forever; the fresh
          # artefact is what the last sweep learned. Folding is idempotent --
          # `update-state.py` remembers which runs it has applied, so a
          # re-published run adds nothing twice.
          records=""
          if ls experiments/results/health-sweep.*.json >/dev/null 2>&1; then
            records="$records $(ls experiments/results/health-sweep.*.json)"
          fi
          if [ -f sweep-fresh/health.json ]; then
            records="$records sweep-fresh/health.json"
            echo "folding the sweep that triggered this run"
          fi
          if [ -n "$records" ]; then
            # shellcheck disable=SC2086 - the list is built from `ls` above
            python3 scripts/update-state.py \
              --state sweep-in/state.jsonl \
              --generated-at "${PUBLISH_AT}" \
              $records
          else
            echo "no health records at all; every tracker will read unknown"
          fi

      # T-104 and RULES 5.4. ⛔ **Conditional requests are mandatory in `ci`**,
      # and this publisher fetches every upstream after each sweep -- eight
      # times a day. Without validators that is 64 full downloads a day nobody
      # needs. ⚠ A cache miss is a full fetch and never an error: an entry
      # expires, a first run has none, and `read_snapshots` degrades either way.
      # ⚠ v6.1.0, and the version is not cosmetic: GitHub **hard-fails** a run
      # that uses a deprecated `actions/cache`, so a pin nobody revisits stops
      # the publisher rather than degrading it. Measured on 2026-09-09 -- run
      # 34292037925 failed at `Set up job` on a v4.0.2 pin, before a single
      # step ran. ⭐ It failed safely: the previous dataset stayed up.
      - name: Restore the source snapshots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: snapshots
          key: source-snapshots-${{ github.run_id }}
          restore-keys: |
            source-snapshots-

      - name: Generate, verify, and stage
        run: |
          python3 scripts/generate.py \
            ${{ inputs.offline && '--offline' || '' }} \
            --generated-at "${PUBLISH_AT}" \
            --state sweep-in/state.jsonl \
            --source-history sweep-in/sources.jsonl \
            --snapshots snapshots \
            --observed-from github-actions-hosted \
            --out build/data

      # ⛔ The gate that makes this safe to schedule. `generate.py` exits 1 on
      # a failed verification and this step never runs, so `data` keeps what it
      # had. Asserted here as well because a step that publishes must not
      # depend on a reader having noticed an earlier one's exit code.
      - name: Refuse to publish what was not generated
        run: |
          for f in trackers_all.txt trackers_all.json trackers_all.csv report.md metadata.json; do
            if [ ! -s "build/data/$f" ]; then
              echo "::error::build/data/$f is missing or empty; not publishing"
              exit 1
            fi
          done
          # ⛔ EXISTENCE, not size, and the difference is deliberate. Three of
          # the five categories are **legitimately empty**: `stable.txt` until
          # a tracker has five observations, `foss.txt` until a FOSS source or
          # the operator's seed exists, `hardcoded.txt` until there is an input
          # file. Checking `-s` here would refuse to publish because the
          # dataset is honest about what it does not know yet.
          for f in common.txt anime.txt stable.txt foss.txt hardcoded.txt; do
            if [ ! -f "build/data/$f" ]; then
              echo "::error::build/data/$f was not generated; not publishing"
              exit 1
            fi
          done
          python3 - <<'PY'
          import json
          with open("build/data/trackers_all.json", encoding="utf-8") as fh:
              doc = json.load(fh)
          rows, count = len(doc["trackers"]), doc["count"]
          assert rows == count, f"{rows} rows against a stated count of {count}"
          assert rows > 0, "refusing to publish an empty dataset"
          print(f"{rows} trackers, {len(doc['fields'])} fields per row")
          PY

      - name: Publish
        run: |
          cp build/data/trackers_all.txt build/data/trackers_all.json \
             build/data/trackers_all.csv build/data/report.md \
             build/data/metadata.json build/data/common.txt \
             build/data/anime.txt build/data/stable.txt \
             build/data/foss.txt build/data/hardcoded.txt published/
          cp sweep-in/state.jsonl published/state.jsonl 2>/dev/null || true
          cp sweep-in/sources.jsonl published/sources.jsonl 2>/dev/null || true
          # T-101. "Source quality is not a one-time judgement" is the entry's
          # own approach, and a report regenerated by hand is one. It reads the
          # corpus this run already built and the history folded above, so it
          # costs no third party a request. Failure is not fatal: a missing
          # quality report is worth less than a published dataset.
          python3 scripts/source-quality.py --json             --history sweep-in/sources.jsonl             > published/source-quality.json ||             echo "::warning::the source quality report was not produced"
          cp docs/schema.md published/schema.md
          cd published
          git add -A
          if git diff --cached --quiet; then
            echo "the dataset is unchanged; nothing to publish"
            exit 0
          fi
          git commit -m "Dataset generated at ${PUBLISH_AT}"
          git push origin data

      - name: Say what landed
        if: always()
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            head -3 build/data/trackers_all.csv 2>/dev/null || echo "(nothing generated)"
            echo '```'
            echo
            echo "Raw: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/trackers_all.txt"
            echo
            echo "A tracker recorded \`unknown\` was never measured or measured"
            echo "too few times to say more. Nothing here is \`dead\`."
          } >> "$GITHUB_STEP_SUMMARY"
