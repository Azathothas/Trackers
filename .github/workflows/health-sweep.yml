# Health sweep: the first thing here that measures real trackers.
#
# T-024 and T-029. Every other measurement in this project asks what a runner
# can do; this one asks what the corpus is, and it is the only workflow that
# contacts the trackers themselves.
#
# WHAT BOUNDS IT, since it spends other people's bandwidth:
#
#   * BEP 34 is consulted per host before any probe and a denial or an
#     undetermined lookup skips the tracker. There is no flag that skips it.
#     RULES 4, and until it existed this run was forbidden outright.
#   * It never announces. The probe stops at BEP 15 connect and HTTP scrape;
#     there is no announce code path to reach.
#   * One connection per host at a time, in both profiles, not configurable.
#   * The `ci` profile probes a SAMPLE, not the corpus, and `ci` is the default
#     on every host. Choosing `local` here is a deliberate act.
#   * `only_source` narrows the corpus to what one upstream contributed, so a
#     question about one list costs the requests that list needs instead of a
#     uniform sample of everything (T-034). It narrows WHAT is probed and
#     changes nothing about HOW: every bound above still applies, and BEP 34
#     is still consulted per host before any socket opens.
#   * A whole-run deadline. Anything not reached is recorded `unknown`, never
#     `dead`.
#
# ⭐ SCHEDULED, operator ruling 2026-09-08, after both conditions the earlier
# ruling named were met: T-037 landed, so a resolver failure is no longer
# published as the tracker being gone, and T-026 computes what a run spends --
# 6072 DNS lookups at worst for a full corpus, 6.1% of the operator's ceiling.
#
# ⛔ THE CADENCE IS D7's AND THE SLICE ROTATES, WHICH IS NOT THE SAME THING.
# `ci` probes a sample, and a fixed sample scheduled every three hours means
# the SAME 190 trackers are contacted eight times a day forever while the
# other 1137 are never contacted again -- so `MIN_SAMPLES_FOR_DEATH` could
# never be reached for them. `scripts/probe-corpus.py` derives a rotation from
# the injected clock and takes one of seven disjoint slices, so a pass over
# the corpus takes 21 hours and **each tracker is probed once per 21 hours**,
# comfortably inside the three-hour ceiling rather than at it.
#
# ⛔ AND THE ROTATION IS THE SAMPLER, NOT THE CEILING -- a distinction this
# workflow did not make until T-087. The rotation is a wall-clock bucket, so
# two runs started inside one bucket take the **identical** slice; scheduled
# runs firing 131 and 163 minutes late are measured here (T-009), and on
# 2026-09-08 runs 34281244142 and 34289476724 both took slice 5 and contacted
# 192 trackers 5878s apart, inside D7's 10800s interval. The ceiling is read
# from the recorded history now -- `--state`, fetched below -- so no
# arithmetic over a clock can breach it. `tests/test_rotation.py` asserts the
# coverage, that two consecutive rotation integers share no tracker, and that
# two consecutive RUNS share none either, which is the property that was
# missing and the one the schedule actually needs.
#
# ⚠ `tests/test_politeness.py` reads this file and fails if any cron here is
# faster than D7's interval. The workflow architecture -- what else runs, and
# where the records go -- is still T-084 and T-063.
name: Health sweep

on:
  schedule:
    # Every three hours on the hour, UTC. Exactly D7's default interval.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "ci probes a sample; local probes the whole corpus"
        required: false
        default: "ci"
        type: choice
        options: [ci, local]
      deadline:
        description: "seconds for the whole run"
        required: false
        default: "900"
        type: string
      only_source:
        description: "probe only what this source contributed (blank = whole corpus)"
        required: false
        default: ""
        type: string

# Least privilege. It reads the tree, probes, and uploads an artefact. It does
# not write to the repository: where the records eventually live is T-063's
# decision and not this workflow's to pre-empt.
permissions:
  contents: read

# Two sweeps at once would double what every tracker sees from us.
concurrency:
  group: health-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Pinned to a commit SHA, not a tag: tags are mutable (C-45).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ⛔ D7's CEILING IS READ FROM WHAT WAS RECORDED, NOT ASSUMED FROM THE
      # CADENCE. T-087. The rotation below samples the corpus; it never
      # enforced anything, and for one day it was all that stood between this
      # workflow and contacting somebody twice inside their interval. It is a
      # wall-clock bucket, so two runs started inside one bucket take the
      # identical slice -- runs 34281244142 (21:33:23Z) and 34289476724
      # (23:11:21Z) both took slice 5, and 192 trackers carry observations
      # 5878s apart in the published `state.jsonl` as a result.
      #
      # ⛔ A FETCH FAILURE STOPS THE JOB, and the direction is deliberate.
      # Being wrong by not probing costs us a measurement; being wrong by
      # probing costs an operator a request they had already answered. So the
      # only case that proceeds without a history is the one where there
      # genuinely is none: no `data` branch at all, which is a first run.
      - name: Take the recorded history the ceiling is enforced from
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            if git cat-file -e FETCH_HEAD:state.jsonl 2>/dev/null; then
              git show FETCH_HEAD:state.jsonl > state.jsonl
              echo "history: $(wc -l < state.jsonl) lines from the data branch"
            else
              echo "the data branch carries no state.jsonl yet"
            fi
          else
            echo "no data branch; this run has no history to be polite against"
          fi

      # ⛔ ONE instant for the whole job, and both steps below read it.
      # The dry run existed to state what is about to be contacted, and with
      # the rotation it stopped doing that: it defaulted the clock to the epoch
      # and previewed slice 0 while the sweep, given the real date, contacted
      # slice 3. A preview of a different 190 trackers is not a preview.
      # Measured in run 34252497106, which is why this step exists.
      - name: Fix the instant this run is stamped with
        run: echo "SWEEP_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Record the vantage this measurement comes from
        run: |
          echo "runner image     : ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "python           : $(python3 --version)"
          echo "date (UTC)       : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "run id / attempt : ${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}"
          echo "profile          : ${{ inputs.profile || 'ci' }}"
          echo "trigger          : ${GITHUB_EVENT_NAME}"

      # Dry run first, so the summary states what is about to be contacted
      # before anything is. A sweep whose scale is only visible afterwards is
      # one nobody can decline.
      - name: What this run would probe
        env:
          # ⛔ A `schedule:` event carries no inputs at all, so every one of
          # them needs a fallback here. Without it `--deadline ""` is an
          # argparse error and every scheduled run exits 2 having probed
          # nothing -- a schedule that looks configured and measures never.
          TRACKERS_PROFILE: ${{ inputs.profile || 'ci' }}
        run: |
          python3 scripts/probe-corpus.py --offline-corpus --dry-run \
            --generated-at "${SWEEP_AT}" \
            --state state.jsonl \
            ${{ inputs.only_source && format('--only-source {0}', inputs.only_source) || '' }}

      - name: Sweep
        id: sweep
        env:
          TRACKERS_PROFILE: ${{ inputs.profile || 'ci' }}
        run: |
          python3 scripts/probe-corpus.py \
            --offline-corpus \
            --deadline "${{ inputs.deadline || '900' }}" \
            --generated-at "${SWEEP_AT}" \
            --state state.jsonl \
            ${{ inputs.only_source && format('--only-source {0}', inputs.only_source) || '' }} \
            --out "sweep-out"

      # T-024's `Prove` clause, run where the records are real. It reads the
      # sweep's own output rather than the tree, because the tree has no health
      # records and will not until T-063 decides where they live.
      # ⚠ Guarded on the file existing, and only on that. A run in which D7
      # held every slice contacts nobody and writes nothing -- which is the
      # correct outcome, not a failure -- and this check exits 2 on a directory
      # that is not there. Reporting a polite run as a red job is how a red job
      # stops meaning anything. ⛔ The guard is `-f`, never a `continue-on-error`
      # on the check itself: that would also swallow a record with no vantage,
      # which is the thing this step exists to refuse.
      - name: Every record carries its vantage
        run: |
          if [ -f sweep-out/health.json ]; then
            python3 scripts/check-vantage-metadata.py --path sweep-out
          else
            echo "no records: every tracker in this run's slices had been"
            echo "contacted inside D7's interval, so nobody was probed."
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Health sweep"
            echo
            echo "profile: \`${{ inputs.profile || 'ci' }}\`, deadline ${{ inputs.deadline || '900' }}s, trigger \`${GITHUB_EVENT_NAME}\`"
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('sweep-out/health.json'));print(json.dumps({'counts':d['counts'],'limits':d['limits'],'ceiling':d['ceiling'],'vantage':d['vantage']},indent=2))" || echo "(no records: D7 held every slice this run could have taken)"
            echo '```'
            echo
            echo "\`ceiling\` is T-087: which trackers D7 forbade contacting, read"
            echo "from the recorded history rather than assumed from the cadence."
            echo "\`enforced_from_history: false\` means no history was supplied and"
            echo "the ceiling rested on the rotation's arithmetic, which is what"
            echo "contacted 192 trackers twice in 98 minutes on 2026-09-08."
            echo
            echo "A tracker not reached before the deadline is \`unknown\`, never"
            echo "\`dead\`. A refusal is the operator's BEP 34 record and is not a"
            echo "statement about whether the tracker is running."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-sweep-${{ github.run_id }}
          path: sweep-out/
          if-no-files-found: warn
          retention-days: 90
