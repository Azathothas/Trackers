[package]
name = "tlsprobe"
version = "0.1.0"
edition = "2021"
description = "TLS + HTTP/2 fingerprint oracle: JA3, JA4, JA4_r, Akamai HTTP/2, header order"

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
