# cargo-about configuration. Generates THIRD_PARTY.md from Cargo.lock so the
# notice file cannot drift from what actually ships.
#
# The accept list is deliberately the same set deny.toml allows. A crate whose
# licence is not here fails generation, which is the point: a new dependency
# under a copyleft licence has to stop the build, not appear quietly in a
# generated file.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# Only what a released binary actually links.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
