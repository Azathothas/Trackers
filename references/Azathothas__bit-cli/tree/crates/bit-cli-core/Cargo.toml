[package]
name = "bit-cli-core"
description = "Engine, web seed addressing, and metainfo handling for bit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["torrent", "bittorrent", "webseed", "bep19", "download"]
categories = ["network-programming"]
publish = false

[lib]
name = "bit_cli_core"
path = "src/lib.rs"

[features]
default = ["dht", "pex", "lsd", "upnp"]
dht = []
pex = []
lsd = []
upnp = []
# `--render`: drive an already-installed Chrome or Edge over the DevTools
# protocol and extract from the DOM after script has run. Off by default and
# built by a CI job so it cannot rot. See `TODO/cli-surface.md`, T-244.
render = ["dep:chromiumoxide", "dep:futures-util"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chromiumoxide = { workspace = true, optional = true }
chrono.workspace = true
encoding_rs.workspace = true
futures-util = { workspace = true, optional = true }
globset.workspace = true
hdrhistogram.workspace = true
ignore.workspace = true
impit.workspace = true
librqbit.workspace = true
librqbit-bencode.workspace = true
librqbit-core.workspace = true
librqbit-peer-protocol.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
# The MSE key exchange needs a private exponent and the handshake needs
# padding. See src/mse/.
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
# A scratch file for one call, not state: `librqbit` reads its peer blocklist
# from a URL at session start and there is no in-memory door. See
# `TODO/peers.md`, T-164.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# `loopback-tlsprobe` terminates TLS so it can read the HTTP/2 half of a
# client's fingerprint, and a handshake needs a certificate. Nothing in this
# tree could make one before, which is the blocker T-253 carries.
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs", "test-util"] }

# The signing and redirect routing in the file server is logic, not plumbing,
# and a fixture that answers 403 when it should not would fail a download and
# look like a defect in `bit-cli`. `test = true` puts its unit tests in
# `cargo test --workspace` alongside everything else.
[[example]]
name = "loopback-fileserver"
test = true

# Same reason as above: the handshake bytes and the hex decoding are logic, and
# a churn generator that sends a malformed handshake would measure the far
# side refusing it rather than the far side leaking a socket.
[[example]]
name = "loopback-churn"
test = true

# The oracle for T-244's acceptance. Its ClientHello parser, its HPACK decoder
# and its golden-manifest reader are the things every fingerprint assertion
# rests on, so `test = true` puts their unit tests in `cargo test --workspace`
# with everything else. A parser that reads a hello wrong asserts the wrong
# fingerprint and says PASS.
[[example]]
name = "loopback-tlsprobe"
path = "examples/loopback-tlsprobe/main.rs"
test = true
