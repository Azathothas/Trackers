# cargo-deny configuration.
#
# bit-cli ships under MIT. A transitive copyleft dependency would relicense the
# result, and for the netdisk deployment an AGPL dependency would attach
# network-use source disclosure. So this file is a licence gate, not a lint:
# a dependency whose licence is not on the list below fails the build.

[graph]
all-features = true

[licenses]
# Permissive licences only. Every one here is compatible with shipping an MIT
# binary, and each needs its notice preserved in THIRD_PARTY.md.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 covers `webpki-roots` and `webpki-root-certs`, which
    # are the Mozilla CA certificate bundle rather than code. It is a
    # permissive *data* licence: use, modify, and redistribute freely, with no
    # obligation beyond keeping the disclaimers. Nothing in it reaches the
    # source tree or the binary's own licence. It is allowed here rather than
    # in the blanket list so the reason is attached to the exception.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# librqbit is Apache-2.0 only, not dual licensed. That is fine for an MIT
# source tree, and the obligation it carries is on the binary distribution:
# ship the Apache-2.0 text and any NOTICE content. See TODO/licensing.md.

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing is banned outright yet. Add an entry here rather than an exception in
# the allow list when a crate has to be kept out for a reason other than its
# licence.
deny = []

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
